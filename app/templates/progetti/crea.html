{% extends 'base.html' %}
{% block title %}Crea progetto — SchoolHRM{% endblock %}
{% block content %}
<div class="form-card" style="max-width:600px">
  <h2>Crea nuovo progetto</h2>
  <form method="post">
    <div class="form-group">
      <label for="titolo">Titolo</label>
      <input type="text" id="titolo" name="titolo" required autofocus>
    </div>
    <div class="form-group">
      <label for="descrizione">Descrizione</label>
      <textarea id="descrizione" name="descrizione" rows="4"></textarea>
    </div>
    <div class="form-group">
      <label for="stato">Stato</label>
      <select id="stato" name="stato">
        {% for s in stati %}
          <option value="{{ s }}" {% if s == 'disponibile' %}selected{% endif %}>
            {{ s|replace('_', ' ')|title }}
          </option>
        {% endfor %}
      </select>
    </div>
    <div class="actions">
      <button type="submit" class="btn btn-primary">Crea</button>
      <a href="{{ url_for('main.lista_progetti') }}" class="btn btn-secondary">Annulla</a>
    </div>
  </form>
</div>
{% endblock %}
